# Конфигурация ruff — линтер проекта (ставится из requirements-dev.txt).
# Запуск:  ruff check .
#
# Начинаем консервативно: правила pyflakes (F) — это реальные баги
# (неиспользуемые импорты/переменные, опечатки в именах), а не вкусовщина.
# Стилевые правила (E/W/I) можно включить позже отдельной задачей.
target-version = "py311"
line-length = 120

[lint]
select = ["F"]

[lint.per-file-ignores]
# main.py — намеренный фасад: реэкспортит имена перенесённых при декомпозиции
# (задача 4.1) модулей ради обратной совместимости (main.X) и тестов.
# Поэтому F401 (неиспользуемый импорт), F403/F405 (`from config import *`)
# здесь ожидаемы и не являются ошибкой.
"main.py" = ["F401", "F403", "F405"]
# Тесты импортируют модули ради фикстур и побочных эффектов импорта —
# линтер видит часть таких импортов как неиспользуемые.
"tests/*" = ["F401"]
