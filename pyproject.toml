[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "satanbonchbot"
version = "0.1.0"
description = "Telegram-бот для студентов СПбГУТ: расписание, автоотметка занятий, чтение и отправка сообщений ЛК, уведомления."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Satanyan" }]
keywords = ["telegram", "bot", "aiogram", "sut", "schedule"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Communications :: Chat",
]

# Рантайм-зависимости запинены в requirements.txt ради воспроизводимого
# Docker-образа; здесь не дублируем, чтобы не было двух источников правды.

[project.urls]
Homepage = "https://github.com/RealSatanyan/SatanBonchBot"
Issues = "https://github.com/RealSatanyan/SatanBonchBot/issues"

[tool.hatch.build.targets.wheel]
packages = ["satanbonchbot"]

# --- Линтер ------------------------------------------------------------------

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# Консервативно: правила pyflakes (F) — это реальные баги
# (неиспользуемые импорты/переменные, опечатки в именах), а не вкусовщина.
select = ["F"]

[tool.ruff.lint.per-file-ignores]
# Тесты импортируют модули ради фикстур и побочных эффектов импорта —
# линтер видит часть таких импортов как неиспользуемые.
"tests/*" = ["F401"]

# --- Тесты -------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --cov=satanbonchbot --cov-report=term:skip-covered"
